crons:
  - name: ai-prospecting
    description: "Runs the AI prospecting engine every 15 min (14-min batches) to discover and research brands"
    cron: "*/15 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/prospecting"
    method: POST
    enabled: true
  - name: ai-outreach
    description: "Drafts outreach for top-fit prospects and sends approved Outlook emails (daily cap)"
    cron: "*/15 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/outreach"
    method: POST
    enabled: true
  - name: ai-prospecting-watchdog
    description: "Hourly health check: frees a stuck prospecting batch and restarts the engine if idle"
    cron: "7 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/prospecting-watchdog"
    method: POST
    enabled: true
