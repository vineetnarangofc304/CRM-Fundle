crons:
  - name: ai-prospecting
    description: "Runs AI prospecting every 15 min, nightly 10 PM-9 AM IST (code enforces the exact window)"
    cron: "*/15 16-23,0-3 * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/prospecting"
    method: POST
    enabled: true
  - name: ai-outreach
    description: "Drafts outreach for top-fit prospects and sends approved Outlook emails (daily cap)"
    cron: "*/15 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/outreach"
    method: POST
    enabled: true
  - name: ai-prospecting-watchdog
    description: "Hourly night check (10 PM-9 AM IST): frees a stuck prospecting batch and restarts it if idle"
    cron: "7 16-23,0-3 * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/prospecting-watchdog"
    method: POST
    enabled: true
