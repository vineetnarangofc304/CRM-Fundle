crons:
  - name: ai-prospecting
    description: "AI prospecting every 15 min, 24h: night (10 PM-9 AM IST) discovers + researches; day only researches + finds contacts"
    cron: "*/15 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/prospecting"
    method: POST
    enabled: true
  - name: ai-outreach
    description: "Drafts outreach for top-fit prospects and sends approved Outlook emails (daily cap)"
    cron: "*/15 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/outreach"
    method: POST
    enabled: true
  - name: ai-prospecting-watchdog
    description: "Hourly check: frees a stuck prospecting batch and restarts it if idle"
    cron: "7 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/prospecting-watchdog"
    method: POST
    enabled: true
  - name: linkedin-agent
    description: "LinkedIn Agent every 15 min: finds contacts' LinkedIn profiles, sends invites and messages within Admin daily limits"
    cron: "*/15 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/linkedin"
    method: POST
    enabled: true
