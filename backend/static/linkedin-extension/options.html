<!doctype html>
<html><head><meta charset="utf-8"><title>Fundle LinkedIn Agent – Settings</title>
<style>body{font:14px system-ui;max-width:560px;margin:32px auto;color:#0f172a}label{display:block;margin:12px 0 4px;font-weight:600}input{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}
.days label{display:inline-flex;gap:4px;margin-right:10px;font-weight:400}.days input{width:auto}button{margin-top:18px;border:0;border-radius:999px;padding:9px 16px;font-weight:600;background:#1A73E8;color:#fff;cursor:pointer}
#msg{margin-top:12px}.muted{color:#64748b;font-size:12px}</style></head>
<body><h2>Fundle CRM · LinkedIn Agent</h2>
<label>CRM address</label><input id="crmUrl" placeholder="https://fundlecrm.fundle.ai">
<label>Extension key</label><input id="token" placeholder="fx_…  (CRM → LinkedIn Prospecting → Chrome extension → Create key)">
<label>Working hours (your local time)</label><div style="display:flex;gap:8px"><input id="startHour" type="number" min="0" max="23"><input id="endHour" type="number" min="1" max="24"></div>
<label>Working days</label><div class="days" id="days"></div>
<p class="muted">Daily limits and invite/message texts are set by your admin in the CRM.</p>
<button id="save">Save & test connection</button><div id="msg"></div>
<script src="options.js"></script></body></html>
